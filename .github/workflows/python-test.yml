name: Python test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
    build:
        strategy:
          fail-fast: false
          matrix:
            os: ["ubuntu-latest", "macos-latest"]
            python-version: ["3.10", "3.11", "3.12" ]
            mpi: [ "openmpi", "mpich"]

        runs-on: ${{ matrix.os }}

        env:
          COVERAGE_PROCESS_START: pyproject.toml  # Coverage auto-start for serial and MPI processes
          PYTHONUNBUFFERED: "1"  # Write standard output and errors immediately (diagnostic).
          PYTHONFAULTHANDLER: "1"  # Print Python stack traces for certain fatal crashes (diagnostic).

        steps:
          - name: Check out repository
            uses: actions/checkout@v6

          - name: Setup MPI ${{ matrix.mpi }}
            uses: mpi4py/setup-mpi@v1
            with:
              mpi: ${{ matrix.mpi }}

          # Hosted runners can expose a MANA RDMA device that UCX cannot initialize.
          # These single-node tests only need TCP, shared memory, and self transports.
          - name: Configure UCX for single-node CI
            if: runner.os == 'Linux' && matrix.mpi == 'mpich'
            run: echo "UCX_TLS=tcp,sm,self" >> "$GITHUB_ENV"

          - name: Install uv, set the python version, and enable cache
            uses: astral-sh/setup-uv@v5
            with:
              python-version: ${{ matrix.python-version }}
              enable-cache: false

          - name: Install dependencies
            id: install
            run: |
                uv pip install --force-reinstall --no-binary=mpi4py ."[test]"

          - name: Install temporary tracing tool
            if: runner.os == 'Linux' && matrix.mpi == 'mpich'
            run: sudo apt-get update && sudo apt-get install -y strace

          - name: Run serial tests
            run: python -m pytest

          - name: Run MPI tests
            run: |
              mpirun \
                -np 8 \
                --map-by :OVERSUBSCRIBE \
                --bind-to none \
                python -m pytest --with-mpi

          - name: Combine and report coverage
            run: |
              python -m coverage combine
              python -m coverage report -m --format markdown > cov_report.txt
              python -m coverage xml

          # Temporary diagnostics run independently after the normal tests, even if they fail.
          # A failed probe remains a job failure; no retries or continue-on-error are used.
          - name: Trace singleton MPI startup
            if: ${{ !cancelled() && runner.os == 'Linux' && matrix.mpi == 'mpich' && steps.install.outcome == 'success' }}
            run: |
              mkdir -p mpi-diagnostics
              timeout --kill-after=10s 60s strace -f -tt -s 256 \
                -o mpi-diagnostics/singleton.trace \
                python .github/scripts/mpi_startup_probe.py

          - name: Trace explicitly launched MPI startup
            if: ${{ !cancelled() && runner.os == 'Linux' && matrix.mpi == 'mpich' && steps.install.outcome == 'success' }}
            run: |
              mkdir -p mpi-diagnostics
              timeout --kill-after=10s 60s strace -f -tt -s 256 \
                -o mpi-diagnostics/launched.trace \
                mpirun -np 1 python .github/scripts/mpi_startup_probe.py

          - name: Trace pytest collection
            if: ${{ !cancelled() && runner.os == 'Linux' && matrix.mpi == 'mpich' && steps.install.outcome == 'success' }}
            run: |
              mkdir -p mpi-diagnostics
              timeout --kill-after=10s 120s strace -f -tt -s 256 \
                -o mpi-diagnostics/collection.trace \
                python -m pytest --collect-only

          - name: Upload temporary MPI traces
            if: ${{ always() && runner.os == 'Linux' && matrix.mpi == 'mpich' }}
            uses: actions/upload-artifact@v4
            with:
              name: mpi-diagnostics-${{ matrix.os }}-python-${{ matrix.python-version }}-${{ matrix.mpi }}-attempt-${{ github.run_attempt }}
              path: mpi-diagnostics/*.trace
              if-no-files-found: warn
              retention-days: 7

          - name: Save PR number
            if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'  && matrix.mpi == 'openmpi'
            run: echo ${{ github.event.number }} > pr_number.txt

          - name: Save coverage report and PR number
            if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'  && matrix.mpi == 'openmpi'
            uses: actions/upload-artifact@v4
            with:
              name: coverage-report
              path: |
                cov_report.txt
                pr_number.txt
              retention-days: 1

          - name: Upload coverage reports to Codecov
            uses: codecov/codecov-action@v3
            with:
              token: ${{ secrets.CODECOV_TOKEN }}
